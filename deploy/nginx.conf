# mas-router-site 容器内的 nginx 配置。
#
# TLS 由共享网关（ai_video_nginx）终止，这个容器只监听 8080，只服务静态文件。
# 容器以非 root（uid 101）运行且文件系统只读，所以 pid 和各类 temp 都放 /tmp，
# 由 compose 以 tmpfs 挂进来。
#
# 站点零外部资源，所有 CSS/JS 内联；因此这里没有 vendor 目录、没有代理规则，
# 唯一的上游就是文件系统。任何一条 proxy_pass 出现在这里都是部署出错了。

worker_processes 1;
pid /tmp/nginx.pid;
error_log /dev/stderr warn;

events { worker_connections 512; }

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;

  sendfile on;
  tcp_nopush on;
  keepalive_timeout 30s;
  server_tokens off;

  gzip on;
  gzip_vary on;
  gzip_min_length 1024;
  gzip_types text/plain text/css text/xml application/xml application/javascript application/json image/svg+xml;

  # 只读文件系统：这些路径必须可由运行时写入。
  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 8080;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;
    charset utf-8;
    client_max_body_size 1m;

    # 内容随镜像更新，5 分钟缓存足够；真正的刷新靠替换容器。
    expires 5m;

    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "camera=(), microphone=(), geolocation=()" always;

    # 容器健康检查。不写 access log：30 秒一次会把日志刷满。
    location = /healthz {
      access_log off;
      default_type text/plain;
      return 200 "ok\n";
    }

    # .nojekyll 这类点文件不对外，well-known 留给未来的 ACME。
    location ~ /\.(?!well-known) { deny all; }

    location / {
      limit_except GET HEAD { deny all; }
      try_files $uri $uri/ =404;
    }

    # 404 页只允许内部跳转，直接访问 /404.html 也返回 404，
    # 否则「一个刚好叫 404 的正常页面」会污染监控里的状态码。
    error_page 404 /404.html;
    location = /404.html { internal; }
  }
}
