# main.luteos.com 的共享网关 server block。
#
# 只监听 443；80 的跳转块保留但依赖腾讯云安全组放行 80 才会生效。
# 证书复用 *.luteos.com 泛域名证书（挂在共享网关的 /etc/letsencrypt）。
# 上游是静态站容器发布在宿主 172.20.0.1:18890 的端口。
server {
    listen 80;
    server_name main.luteos.com;
    location / {
        return 301 https://$host$request_uri;
    }
}
server {
    listen 443 ssl;
    http2 on;
    server_name main.luteos.com;
    ssl_certificate /etc/letsencrypt/live/luteos.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/luteos.com/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;
    client_max_body_size 1m;
    add_header Strict-Transport-Security "max-age=31536000" always;
    location / {
        proxy_pass http://172.20.0.1:18890;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Host $host;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Forwarded-Port 443;
        proxy_connect_timeout 5s;
        proxy_send_timeout 30s;
        proxy_read_timeout 60s;
    }
}
